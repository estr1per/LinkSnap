$kind: http-request
name: Update Link Tags
method: PUT
url: '{{baseUrl}}/api/links/{{linkId}}/tags'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "tags": ["tag1", "tag2"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function() { pm.response.to.be.json; });
