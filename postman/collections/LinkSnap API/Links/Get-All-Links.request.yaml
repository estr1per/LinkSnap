$kind: http-request
name: Get All Links
method: GET
url: '{{baseUrl}}/api/links'
order: 2000
queryParams:
  - key: page
    value: '1'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function() { pm.response.to.be.json; });
