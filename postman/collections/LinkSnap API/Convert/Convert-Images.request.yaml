$kind: http-request
name: Convert Images
method: POST
url: '{{baseUrl}}/api/convert/images'
order: 1000
body:
  type: formdata
  content:
    - key: files
      value: ''
      type: text
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
