$kind: http-request
name: Recommend Tags
method: GET
url: '{{baseUrl}}/api/tags/recommend'
order: 3000
queryParams:
  - key: url
    value: 'https://example.com'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function() { pm.response.to.be.json; });
