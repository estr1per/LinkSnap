$kind: http-request
name: Check Alias Availability
method: GET
url: '{{baseUrl}}/api/alias/check'
order: 2000
queryParams:
  - key: alias
    value: myalias
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function() { pm.response.to.be.json; });
