$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "testuser",
      "email": "test@example.com",
      "password": "Test1234!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 201", function() { pm.expect(pm.response.code).to.be.oneOf([200, 201]); });
