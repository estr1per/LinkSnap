$kind: http-request
name: Generate API Key
method: POST
url: '{{baseUrl}}/api/user/generate-api-key'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function() { pm.response.to.be.json; });
