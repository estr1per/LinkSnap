$kind: http-request
name: 'Shorten URL (API Key)'
method: POST
url: '{{baseUrl}}/api/v1/shorten'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: X-API-Key
    value: '{{apiKey}}'
body:
  type: json
  content: |-
    {
      "url": "https://example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response has short URL", function() {
        const json = pm.response.json();
        pm.expect(json).to.have.property('shortUrl');
      });
