$kind: http-request
name: Admin Send Message
method: POST
url: '{{baseUrl}}/api/admin/chat/{{chatId}}/message'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "message": "Hello"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function() { pm.response.to.be.json; });
