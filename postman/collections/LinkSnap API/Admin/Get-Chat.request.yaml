$kind: http-request
name: Get Chat
method: GET
url: '{{baseUrl}}/api/admin/chat/{{chatId}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function() { pm.response.to.be.json; });
