$kind: http-request
name: Admin Stats
method: GET
url: '{{baseUrl}}/api/admin/stats'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() { pm.response.to.have.status(200); });
      pm.test("Response is JSON", function() { pm.response.to.be.json; });
